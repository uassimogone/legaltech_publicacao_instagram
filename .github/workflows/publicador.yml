name: Execucao Diario LegalTech Bot

on:
  schedule:
    # 12:00 UTC corresponde às 09:00 da manhã no horário de Brasília
    - cron: '0 12 * * *'
  workflow_dispatch: # Ativa o botão de testes manuais no painel

jobs:
  rodar_automacao:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor da Nuvem
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependências do Sistema (Fontes para as Imagens)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu-core fonts-liberation

    - name: Instalar as Bibliotecas do Projeto
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Executar o Pipeline do Robô
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      run: |
        python main.py
